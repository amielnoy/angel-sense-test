name: Playwright Tests with Allure 3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Cache Allure History
      uses: actions/cache@v4
      id: allure-history-cache
      with:
        path: allure-history
        key: ${{ runner.os }}-allure-history-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-allure-history-

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install --with-deps chromium

    - name: Install Allure 3 CLI
      run: npm install -g allure || echo "Allure CLI installation failed, will use npx"

    - name: Run Playwright tests (Population by Country only)
      id: run-tests
      run: npx playwright test tests/population-by-country/ --shard=${{ matrix.shard }}/4
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.angelsense.com' }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY || '' }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET || '' }}
      continue-on-error: true

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-shard-${{ matrix.shard }}
        path: allure-results/
        retention-days: 7
        if-no-files-found: ignore
        compression-level: 1

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-shard-${{ matrix.shard }}
        path: test-results/
        retention-days: 3
        if-no-files-found: ignore
        compression-level: 1

    - name: Comment PR with Allure Report
      if: github.event_name == 'pull_request' && always() && matrix.shard == 1
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const reportPath = path.join(process.cwd(), 'allure-report');
          if (fs.existsSync(reportPath)) {
            const pagesUrl = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Allure Test Report\n\n' +
                    'Allure 3 test report has been generated and uploaded as an artifact.\n\n' +
                    '**To view the report:**\n' +
                    '1. Go to the "Actions" tab\n' +
                    '2. Click on this workflow run\n' +
                    '3. Download the "allure-report" artifact\n' +
                    '4. Extract and open `index.html` in your browser\n\n' +
                    '**Live report:** ' + pagesUrl
            });
          }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Allure 3 CLI
      run: npm install -g allure || echo "Allure CLI installation failed, will use npx"

    - name: Download Allure Results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-shard-*
        path: allure-results/
        merge-multiple: true

    - name: Download Allure History
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: allure-history
        path: allure-history/

    - name: Ensure Allure History directory
      run: mkdir -p allure-history

    - name: Generate Allure 3 Report with History
      run: |
        if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
          bash scripts/allure-with-history.sh
        else
          echo "No test results found, creating empty report"
          rm -rf allure-report || true
          mkdir -p allure-report
          echo '<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No test results available</h1></body></html>' > allure-report/index.html
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './allure-report'

    - name: Upload Allure History
      uses: actions/upload-artifact@v4
      with:
        name: allure-history
        path: allure-history/
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Publish Pages URL
      run: |
        echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
