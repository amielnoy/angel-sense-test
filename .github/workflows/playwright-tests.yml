name: Playwright Tests with Allure 3

on:
  push:
    branches: [ main, amiel ]
  pull_request:
    branches: [ main, amiel ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: playwright-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.sha }}-shard-${{ matrix.shardIndex }}
      cancel-in-progress: False
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        totalShards: [4]
        node-version: ['lts/*']

    permissions:
      contents: read
      pull-requests: write
    env:
      ALLURE_ENDPOINT: https://amielnoy.testops.cloud
      ALLURE_PROJECT_ID: 1
      ALLURE_TOKEN: ${{ secrets.ALLURE_TESTOPS }}
      ALLURE_LAUNCH_NAME: Playwright-${{ github.run_id }}
      ALLURE_LAUNCH_TAGS: PRODUCTION

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-playwright-

    - name: Cache Allure History
      uses: actions/cache@v4
      id: allure-history-cache
      with:
        path: allure-history
        key: ${{ runner.os }}-allure-history-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-allure-history-

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install --with-deps chromium

    - name: Install Allure 3 CLI (pinned)
      run: npm install -g allure-commandline@2.13.8 --no-audit --no-fund

    - name: Upload results to Allure TestOps (setup allurectl)
      if: always() && env.ALLURE_TOKEN != ''
      uses: allure-framework/setup-allurectl@v1
      with:
        allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
        allure-token: ${{ env.ALLURE_TOKEN }}
        allure-project-id: ${{ env.ALLURE_PROJECT_ID }}  

    - name: Run Playwright tests (sharded)
      id: run-tests
      run: |
        echo "Running shard ${{ matrix.shardIndex }} of ${{ matrix.totalShards }}"
        allurectl watch -- npx playwright test tests --shard=${{ matrix.shardIndex }}/${{ matrix.totalShards }} --reporter=list
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.angelsense.com' }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY || '' }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET || '' }}
        ALLURE_RESULTS: allure-results

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ github.run_id }}-shard-${{ matrix.shardIndex }}
        path: allure-results/
        retention-days: 7
        if-no-files-found: ignore
        compression-level: 1

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}-shard-${{ matrix.shardIndex }}
        path: test-results/
        retention-days: 3
        if-no-files-found: ignore
        compression-level: 1

    - name: Comment PR with Allure Report
      if: github.event_name == 'pull_request' && always() && matrix.shardIndex == 1
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const reportPath = path.join(process.cwd(), 'allure-report');
          if (fs.existsSync(reportPath)) {
            const pagesUrl = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Allure Test Report\n\n' +
                    'Allure 3 test report has been generated and uploaded as an artifact.\n\n' +
                    '**To view the report:**\n' +
                    '1. Go to the "Actions" tab\n' +
                    '2. Click on this workflow run\n' +
                    '3. Download the "allure-report" artifact\n' +
                    '4. Extract and open `index.html` in your browser\n\n' +
                    '**Live report:** ' + pagesUrl
            });
          }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit

    - name: Install Allure 3 CLI (pinned)
      run: npm install -g allure-commandline@2.13.8 --no-audit --no-fund

    - name: Download Allure Results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-shard-*
        path: allure-results/
        merge-multiple: true

    - name: Restore Allure History cache
      uses: actions/cache@v4
      with:
        path: allure-history
        key: ${{ runner.os }}-allure-history-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-allure-history-

    - name: Ensure Allure History directory
      run: mkdir -p allure-history

    - name: Generate Allure 3 Report with History
      run: |
        if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
          bash scripts/allure-with-history.sh
        else
          echo "No test results found, creating empty report"
          rm -rf allure-report || true
          mkdir -p allure-report
          echo '<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No test results available</h1></body></html>' > allure-report/index.html
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './allure-report'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Publish Pages URL
      run: |
        echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
