name: Playwright Tests with Allure 3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Install Allure 3 CLI
      run: npm install -g allure

    - name: Run Playwright tests
      run: npm playwright test tests/angel_sense_tests --headed=false --shard=${{ matrix.shard }}/4
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL || 'https://www.angelsense.com' }}
        WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
        WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      continue-on-error: true

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-shard-${{ matrix.shard }}
        path: allure-results/
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-shard-${{ matrix.shard }}
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Comment PR with Allure Report
      if: github.event_name == 'pull_request' && always() && matrix.shard == 1
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Check if allure-report exists
          const reportPath = path.join(process.cwd(), 'allure-report');
          if (fs.existsSync(reportPath)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 Allure Test Report\n\n' +
                    'Allure 3 test report has been generated and uploaded as an artifact.\n\n' +
                    '**To view the report:**\n' +
                    '1. Go to the "Actions" tab\n' +
                    '2. Click on this workflow run\n' +
                    '3. Download the "allure-report" artifact\n' +
                    '4. Extract and open `index.html` in your browser\n\n' +
                    'Or use: `allure serve <extracted-folder>`'
            });
          }

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Allure 3 CLI
      run: npm install -g allure || echo "Allure CLI installation failed, will use npx"

    - name: Download Allure Results (all shards)
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-shard-*
        path: allure-results
        merge-multiple: true

    - name: Generate Allure 3 Report
      run: |
        if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
          allure generate allure-results --clean -o allure-report
        else
          echo "No test results found, creating empty report"
          rm -rf allure-report || true
          mkdir -p allure-report
          echo '<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No test results available</h1></body></html>' > allure-report/index.html
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact (Allure report)
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/

    - name: Deploy Allure report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Publish Pages URL
      run: |
        echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
